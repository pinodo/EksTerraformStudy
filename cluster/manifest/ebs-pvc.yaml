# ~/EksTerraformStudy/cluster/manifest/ebs-pvc.yaml

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sesac-b2-ebs-pvc
spec:
  accessModes:
    - ReadWriteOnce         # EBS는 한 번에 하나의 Node만 연결 가능 (RWO)
  resources:
    requests:
      storage: 5Gi          # 5Gi 요청
  storageClassName: sesac-b2-ebs-sc  # StorageClass 이름