# ~/EksTerraformStudy/cluster/manifest/ebs-storage-class.yaml

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sesac-b2-ebs-sc
provisioner: ebs.csi.aws.com             # EBS CSI 드라이버 사용 선언
reclaimPolicy: Delete                    # PVC 삭제 시 실제 EBS 볼륨도 삭제 (학습 편의)
volumeBindingMode: WaitForFirstConsumer  # Pod 생성 시 볼륨도 같이 생성
parameters:
  type: gp3                              # 사용할 스토리지 타입 (가성비 성능)
  encrypted: "true"